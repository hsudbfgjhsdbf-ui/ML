# ==============================================================================
# Deep Learning Approach - Configuration (Approach 2)
# Medical Insurance Claim Fraud Detection (IIIT Dharwad)
# ==============================================================================
data:
  raw_path: "data/raw/Health Insurance Fraud Claims.xlsx"
  target: "ClaimLegitimacy"
  positive_class: "Fraud"
  id_columns: ["ClaimID", "PatientID", "ProviderID"]
  high_cardinality: ["DiagnosisCode", "ProcedureCode", "ProviderLocation"]
  drop_columns: ["Cluster"]
  split:
    train: 0.70
    val: 0.15
    test: 0.15
    random_state: 42

training:
  epochs: 60
  batch_size: 128
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 15
  gradient_clip: 1.0
  seed: 42
  device: "cpu"
  label_smoothing: 0.05

imbalance:
  # Weighted BCE: minority (fraud) class weight
  class_weight: "balanced"

outputs:
  models_dir: "models/dl"
  eval_dir: "evaluation"
  viz_dir: "visualizations/dl"
  checkpoint_dir: "models/dl/checkpoints"
